<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="vocatree">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>vocatree</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <!-- Google Identity Services & OAuth Client ID -->
  <meta name="google-signin-client_id" content="1002909356316-llhqdfguevm9je83uhtdqblgm5621ra1.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.requestGoogleAuthCode = function(clientId, scopesStr, callback) {
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        console.error("GIS not loaded yet");
        callback(null, "GIS SDK not loaded");
        return;
      }
      try {
        // ux_mode: 'popup'을 사용하여 'postmessage' redirect_uri로 통신 (redirect_uri_mismatch 400 에러 완전 차단)
        var client = google.accounts.oauth2.initCodeClient({
          client_id: clientId,
          scope: scopesStr,
          ux_mode: 'popup',
          callback: function(response) {
            if (response.error) {
              callback(null, response.error);
            } else if (response.code) {
              callback(response.code, null);
            } else {
              callback(null, "No code received");
            }
          },
          error_callback: function(err) {
            console.warn("GIS error_callback:", err);
            var errMsg = err ? (err.message || JSON.stringify(err)) : "Unknown error";
            callback(null, errMsg);
          }
        });

        // 클릭 이벤트 핸들러 맥락에서 즉시 팝업 창 호출
        client.requestCode();
      } catch (e) {
        callback(null, e.toString());
      }
    };

    window.consumeRedirectCode = function() {
      return null;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
