name: linguistic_cabinet
description: "Linguistic Cabinet - Cross-platform English vocabulary notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # iOS/macOS 텍스트 선택 컨텍스트 메뉴가 Flutter SDK cupertino 위젯을 통해
  # CupertinoIcons 폰트를 참조한다. 없으면 해당 아이콘이 빈 박스로 렌더된다.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Local Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.2
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # Utilities
  uuid: ^4.2.0
  crypto: ^3.0.3
  
  # File Operations
  share_plus: ^10.0.0
  file_picker: ^10.3.10
  # Zip archive handling for export/import
  archive: ^3.3.7
  
  # Markdown rendering
  flutter_markdown: ^0.7.0
  
  # Google Drive Sync
  google_sign_in: ^6.2.1
  google_identity_services_web: ^0.3.3
  googleapis: ^13.2.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  
  # Web
  web: ^1.1.0
  flutter_local_notifications: ^22.1.0
  # 타임존 (flutter_local_notifications zonedSchedule용 — 이미 전이 의존성으로 존재)
  timezone: ^0.11.1
  # 홈 화면 위젯 (Android App Widget·iOS WidgetKit — 모바일 전용)
  home_widget: ^0.9.3
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # 테스트에서 path_provider 경로를 임시 디렉토리로 대체하기 위한 플랫폼 인터페이스
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
